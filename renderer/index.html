<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>XMB Media Center</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<canvas id="wave"></canvas>
<div id="vignette"></div>

<div id="sound-toggle">
  <div class="led"></div>
  <div>Sound</div>
</div>

<div id="clock">
  <div class="time" id="clock-time">--:--</div>
  <div class="date" id="clock-date"></div>
</div>

<div id="stage">
  <div id="items-wrapper">
    <div id="items"></div>
  </div>
  <div id="category-viewport">
    <div id="category-row"></div>
  </div>
</div>

<div id="pager"></div>
<div id="hint">Scroll or ↑ ↓ to navigate items · ← → to switch categories · Enter to select · Esc for fullscreen</div>
<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
